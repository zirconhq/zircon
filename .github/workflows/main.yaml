name: main
on:
  push:
    branches:
      - main
jobs:
  main:
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - name: amd64
            os: ubuntu-24.04
            platform: linux/amd64
          - name: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Detect Docker socket group
        id: docker-socket
        run: echo "gid=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            .pnpm-store
            .turbo
          key: cache-${{ matrix.platform.os }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@v0.3
        env:
          DOCKER_SOCKET_GID: ${{ steps.docker-socket.outputs.gid }}
        with:
          imageName: ghcr.io/zirconhq/zircon/devcontainer
          imageTag: latest
          platform: ${{ matrix.platform.platform }}
          useNativeRunner: true
          cacheFrom: ghcr.io/zirconhq/zircon/devcontainer
          push: always
          env: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          runCmd: turbo ci
      - uses: actions/cache/save@v6
        with:
          path: |
            .pnpm-store
            .turbo
          key: cache-${{ matrix.platform.os }}-${{ github.run_id }}

  devcontainer-manifest:
    needs: main
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish devcontainer manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/zirconhq/zircon/devcontainer:latest \
            ghcr.io/zirconhq/zircon/devcontainer:latest-linux-amd64 \
            ghcr.io/zirconhq/zircon/devcontainer:latest-linux-arm64

  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
